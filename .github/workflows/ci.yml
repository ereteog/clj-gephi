name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: ['8', '11', '17']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}

    - name: Install Leiningen
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        lein: 2.11.2

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Cache Leiningen dependencies
      uses: actions/cache@v4
      with:
        path: ~/.lein
        key: ${{ runner.os }}-lein-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-lein-

    - name: Display versions
      run: |
        echo "Java version:"
        java -version
        echo "Leiningen version:"
        lein version

    - name: Fetch dependencies
      run: lein deps

    - name: Run tests
      run: lein test

    - name: Check code compilation
      run: lein check

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Leiningen
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        lein: 2.11.2

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Fetch dependencies
      run: lein deps

    - name: Check namespace declarations
      run: |
        echo "Checking for proper namespace declarations..."
        ! grep -r "^(require " src/ || (echo "Found old-style require forms" && exit 1)
        ! grep -r "^(import " src/ || (echo "Found old-style import forms" && exit 1)
        echo "✓ All namespace declarations are idiomatic"

    - name: Check for trailing whitespace
      run: |
        echo "Checking for trailing whitespace..."
        if grep -r '[[:blank:]]$' src/ test/ --exclude-dir=target; then
          echo "Found trailing whitespace (see above)"
          exit 1
        fi
        echo "✓ No trailing whitespace found"

  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Leiningen
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        lein: 2.11.2

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build JAR
      run: lein jar

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: clj-gephi-jar
        path: target/*.jar
        retention-days: 30
